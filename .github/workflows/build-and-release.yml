name: Build & Release macOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published, created ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0 - leave empty to auto-detect)'
        required: false
        default: ''
      changelog:
        description: 'Manual Changelog / Release Notes (Markdown supported)'
        required: false
        default: ''
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Swift & macOS Environment
        run: |
          sw_vers
          uname -m
          swift --version

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            INPUT_VER="${{ inputs.version }}"
            [[ "$INPUT_VER" != v* ]] && VERSION="v${INPUT_VER}" || VERSION="${INPUT_VER}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v2.0.0"
          fi
          RAW_VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.prerelease }}" = "true" ] || [ "$VERSION" = "v2.0.0" ] || [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${{ inputs.changelog }}" ]; then
            {
              echo "body<<EOF"
              echo "${{ inputs.changelog }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" 2>/dev/null | sed -e 's/[[:space:]]*$//')
            if [ -n "$TAG_MSG" ] && [ "$TAG_MSG" != "$TAG_NAME" ]; then
              {
                echo "body<<EOF"
                echo "$TAG_MSG"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run Swift Tests
        run: swift test

      - name: Build Apple Silicon .app Bundle
        run: |
          echo "=== Building Apple Silicon (arm64) v${{ steps.get_version.outputs.raw_version }} ==="
          APP_VERSION="${{ steps.get_version.outputs.raw_version }}" bash scripts/build_app.sh

      - name: Verify ARM64 Binary & Bundle Signature
        run: |
          MAIN_BIN="dist/Screenshot Indexing.app/Contents/MacOS/Screenshot Indexing"
          if [ ! -f "$MAIN_BIN" ]; then
            echo "::error::Main binary not found at $MAIN_BIN"
            exit 1
          fi
          ARCHS=$(lipo -archs "$MAIN_BIN")
          echo "Final binary architectures: $ARCHS"
          if [[ "$ARCHS" != *"arm64"* ]] || [[ "$ARCHS" == *"x86_64"* ]]; then
            echo "::error::Binary must be Apple Silicon (arm64) only! Got: $ARCHS"
            exit 1
          fi
          codesign --verify --deep --strict "dist/Screenshot Indexing.app"
          echo "Verified Apple Silicon (arm64) binary and bundle signature."

      - name: Package DMG
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p release dmg_root
          cp -R "dist/Screenshot Indexing.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create \
            -volname "Screenshot Indexing" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            "release/Screenshot-Indexing-${VERSION}-macOS-arm64.dmg"
          rm -rf dmg_root
          echo "Generated DMG:"
          ls -lh release/

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Indexing-${{ steps.get_version.outputs.version }}-macOS-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_version.outputs.body }}
          files: |
            release/Screenshot-Indexing-${{ steps.get_version.outputs.version }}-macOS-arm64.dmg
          draft: false
          prerelease: ${{ steps.get_version.outputs.prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
