name: Build & Release macapp

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published, created ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.1 - leave empty to auto-detect)'
        required: false
        default: ''
      changelog:
        description: 'Manual Changelog / Release Notes (Markdown supported)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-universal:
    name: Build macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python 3.11 (universal2) from python.org
        run: |
          PY_VERSION="3.11.9"
          PKG_NAME="python-${PY_VERSION}-macos11.pkg"
          curl -fSL "https://www.python.org/ftp/python/${PY_VERSION}/${PKG_NAME}" -o "/tmp/${PKG_NAME}"
          sudo installer -pkg "/tmp/${PKG_NAME}" -target /
          PYTHON="/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11"
          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          ${PYTHON} --version
          echo "Verifying universal2 Python binary:"
          lipo -archs "${PYTHON}" || true

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            INPUT_VER="${{ inputs.version }}"
            [[ "$INPUT_VER" != v* ]] && VERSION="v${INPUT_VER}" || VERSION="${INPUT_VER}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            PY_VER=$($PYTHON -c "import re; m = re.search(r'VERSION\s*=\s*.*?([0-9]+\.[0-9]+\.[0-9]+)', open('app.py').read()); print(m.group(1) if m else '1.0.0')" 2>/dev/null || echo "1.0.0")
            VERSION="v${PY_VER}"
          fi
          RAW_VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "raw_version=${RAW_VERSION}" >> $GITHUB_OUTPUT

          if [ -n "${{ inputs.changelog }}" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "${{ inputs.changelog }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" 2>/dev/null | sed -e 's/[[:space:]]*$//')
            if [ -n "$TAG_MSG" ] && [ "$TAG_MSG" != "$TAG_NAME" ]; then
              echo "body<<EOF" >> $GITHUB_OUTPUT
              echo "$TAG_MSG" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          fi

      # ── Build ARM64 (native on Apple Silicon runner) ──
      - name: Build ARM64 App
        run: |
          echo "=== Building arm64 (native) ==="
          $PYTHON -m venv .venv-arm64
          source .venv-arm64/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          APP_VERSION="${{ steps.get_version.outputs.raw_version }}" python -m PyInstaller \
            --noconsole \
            --name "Screenshot Indexing" \
            --icon macapp_icon.icns \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --target-arch arm64 \
            --noconfirm \
            app.py
          echo "ARM64 binary arch:"
          lipo -archs "dist/Screenshot Indexing.app/Contents/MacOS/Screenshot Indexing"
          mv dist dist-arm64
          rm -rf build

      # ── Build x86_64 (via Rosetta 2 on Apple Silicon runner) ──
      - name: Build x86_64 App
        run: |
          echo "=== Building x86_64 (via Rosetta 2) ==="
          arch -x86_64 $PYTHON -m venv .venv-x86
          source .venv-x86/bin/activate
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 python -m pip install -r requirements.txt
          APP_VERSION="${{ steps.get_version.outputs.raw_version }}" arch -x86_64 python -m PyInstaller \
            --noconsole \
            --name "Screenshot Indexing" \
            --icon macapp_icon.icns \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --target-arch x86_64 \
            --noconfirm \
            app.py
          echo "x86_64 binary arch:"
          lipo -archs "dist/Screenshot Indexing.app/Contents/MacOS/Screenshot Indexing"
          mv dist dist-x86
          rm -rf build

      # ── Merge into Universal 2 ──
      - name: Merge into Universal App Bundle
        run: |
          python3 .github/scripts/merge_universal.py \
            "dist-x86/Screenshot Indexing.app" \
            "dist-arm64/Screenshot Indexing.app" \
            "dist-universal/Screenshot Indexing.app"

      - name: Update Info.plist & Codesign
        run: |
          RAW_VER="${{ steps.get_version.outputs.raw_version }}"
          PLIST_PATH="dist-universal/Screenshot Indexing.app/Contents/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            plutil -replace CFBundleShortVersionString -string "$RAW_VER" "$PLIST_PATH"
            plutil -replace CFBundleVersion -string "$RAW_VER" "$PLIST_PATH"
            echo "Updated Info.plist version to $RAW_VER"
          fi
          xattr -cr "dist-universal/Screenshot Indexing.app"
          codesign --force --deep --sign - "dist-universal/Screenshot Indexing.app"

      - name: Verify Universal Binary
        run: |
          MAIN_BIN="dist-universal/Screenshot Indexing.app/Contents/MacOS/Screenshot Indexing"
          if [ ! -f "$MAIN_BIN" ]; then
            echo "::error::Main binary not found"
            exit 1
          fi
          ARCHS=$(lipo -archs "$MAIN_BIN")
          echo "Final binary architectures: $ARCHS"
          if [[ "$ARCHS" != *"x86_64"* ]] || [[ "$ARCHS" != *"arm64"* ]]; then
            echo "::error::Binary is NOT universal! Got: $ARCHS"
            exit 1
          fi
          echo "✅ Verified Universal 2 binary (x86_64 + arm64)"

      - name: Package DMG
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p release dmg_root
          cp -R "dist-universal/Screenshot Indexing.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create \
            -volname "Screenshot Indexing" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            "release/Screenshot-Indexing-${VERSION}-macOS-Universal.dmg"
          rm -rf dmg_root
          echo "Generated DMG:"
          ls -lh release/

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Indexing-${{ steps.get_version.outputs.version }}-macOS-Universal
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_version.outputs.body }}
          files: |
            release/Screenshot-Indexing-${{ steps.get_version.outputs.version }}-macOS-Universal.dmg
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
