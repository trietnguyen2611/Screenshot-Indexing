name: Build & Release macapp

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published, created ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.1 - leave empty to auto-detect)'
        required: false
        default: ''
      changelog:
        description: 'Manual Changelog / Release Notes (Markdown supported)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-universal:
    name: Build macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python 3.11 (universal2) from python.org
        run: |
          PY_VERSION="3.11.9"
          PKG_NAME="python-${PY_VERSION}-macos11.pkg"
          curl -fSL "https://www.python.org/ftp/python/${PY_VERSION}/${PKG_NAME}" -o "/tmp/${PKG_NAME}"
          sudo installer -pkg "/tmp/${PKG_NAME}" -target /
          # The python.org universal2 build installs to /Library/Frameworks
          PYTHON="/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11"
          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          ${PYTHON} --version
          # Verify it's truly universal2
          file $(which python3.11 2>/dev/null || echo ${PYTHON}) || true
          lipo -archs ${PYTHON} && echo "Python binary is universal2" || echo "Checking framework binary..."

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            INPUT_VER="${{ inputs.version }}"
            [[ "$INPUT_VER" != v* ]] && VERSION="v${INPUT_VER}" || VERSION="${INPUT_VER}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            PY_VER=$($PYTHON -c "import re; m = re.search(r'VERSION\s*=\s*.*?([0-9]+\.[0-9]+\.[0-9]+)', open('app.py').read()); print(m.group(1) if m else '1.0.0')" 2>/dev/null || echo "1.0.0")
            VERSION="v${PY_VER}"
          fi
          RAW_VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "raw_version=${RAW_VERSION}" >> $GITHUB_OUTPUT

          if [ -n "${{ inputs.changelog }}" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "${{ inputs.changelog }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" 2>/dev/null | sed -e 's/[[:space:]]*$//')
            if [ -n "$TAG_MSG" ] && [ "$TAG_MSG" != "$TAG_NAME" ]; then
              echo "body<<EOF" >> $GITHUB_OUTPUT
              echo "$TAG_MSG" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create venv & Install dependencies
        run: |
          $PYTHON -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Universal macOS App with PyInstaller
        run: |
          source .venv/bin/activate
          APP_VERSION="${{ steps.get_version.outputs.raw_version }}" python -m PyInstaller \
            --noconsole \
            --name "Screenshot Indexing" \
            --icon macapp_icon.icns \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --target-arch universal2 \
            --noconfirm \
            app.py

      - name: Update Info.plist & Codesign
        run: |
          RAW_VER="${{ steps.get_version.outputs.raw_version }}"
          PLIST_PATH="dist/Screenshot Indexing.app/Contents/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            plutil -replace CFBundleShortVersionString -string "$RAW_VER" "$PLIST_PATH"
            plutil -replace CFBundleVersion -string "$RAW_VER" "$PLIST_PATH"
            echo "Updated Info.plist version to $RAW_VER"
          fi
          xattr -cr "dist/Screenshot Indexing.app"
          codesign --force --deep --sign - "dist/Screenshot Indexing.app"

      - name: Verify Universal Binary
        run: |
          MAIN_BIN="dist/Screenshot Indexing.app/Contents/MacOS/Screenshot Indexing"
          if [ ! -f "$MAIN_BIN" ]; then
            echo "::error::Main binary not found"
            exit 1
          fi
          ARCHS=$(lipo -archs "$MAIN_BIN")
          echo "Binary architectures: $ARCHS"
          if [[ "$ARCHS" != *"x86_64"* ]] || [[ "$ARCHS" != *"arm64"* ]]; then
            echo "::error::Binary is NOT universal! Got: $ARCHS"
            exit 1
          fi
          echo "✅ Verified Universal 2 binary (x86_64 + arm64)"

      - name: Package DMG
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p release dmg_root
          cp -R "dist/Screenshot Indexing.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create \
            -volname "Screenshot Indexing" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            "release/Screenshot-Indexing-${VERSION}-macOS-Universal.dmg"
          rm -rf dmg_root
          echo "Generated DMG:"
          ls -lh release/

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Indexing-${{ steps.get_version.outputs.version }}-macOS-Universal
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_version.outputs.body }}
          files: |
            release/Screenshot-Indexing-${{ steps.get_version.outputs.version }}-macOS-Universal.dmg
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
