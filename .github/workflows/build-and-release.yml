name: Build & Release macOS App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application (.app, .dmg, .zip)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller --noconsole --name "Screenshot Indexing" --icon app_icon.icns --add-data "templates:templates" --add-data "static:static" --noconfirm app.py

      - name: Package DMG and ZIP
        run: |
          mkdir -p release
          
          # 1. Package as ZIP
          cd dist
          zip -ry ../release/Screenshot-Indexing-macOS.zip "Screenshot Indexing.app"
          cd ..

          # 2. Package as DMG with /Applications drag-and-drop shortcut
          mkdir -p dmg_root
          cp -R "dist/Screenshot Indexing.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Screenshot Indexing" -srcfolder dmg_root -ov -format UDZO release/Screenshot-Indexing-macOS.dmg
          rm -rf dmg_root

          echo "Generated packages in release directory:"
          ls -lh release/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Indexing-macOS-Packages
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Screenshot Indexing' }}
          files: |
            release/Screenshot-Indexing-macOS.dmg
            release/Screenshot-Indexing-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
